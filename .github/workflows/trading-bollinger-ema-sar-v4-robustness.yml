name: Trading Bollinger EMA SAR V4 Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v4_robustness_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v4_robustness_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v4_robustness_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v4-robustness.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['ES.v.0','NQ.v.0','YM.v.0','RTY.v.0']
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      BES_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade databento pandas numpy
      - name: Compile frozen entry logic and V4 robustness replay
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_backtest.py trading_super_strategy/bollinger_ema_sar_v3_backtest.py trading_super_strategy/bollinger_ema_sar_v4_robustness_backtest.py
      - name: Run V4 exit-neighborhood replay on discovery only
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v4_robustness_backtest.py
      - name: Upload per-market V4 robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v4-robustness-${{ matrix.symbol }}
          path: trading_super_strategy/bollinger_ema_sar_v4_robustness_output/
          if-no-files-found: error
          retention-days: 90

  consolidate:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download V4 robustness market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v4-robustness-*
          path: trading_super_strategy/bollinger_ema_sar_v4_robustness_downloads
      - name: Compile consolidator
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v4_robustness_consolidate.py
      - name: Apply preregistered robustness gates
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v4_robustness_consolidate.py
      - name: Upload cross-market V4 robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v4-robustness-crossmarket
          path: trading_super_strategy/bollinger_ema_sar_v4_robustness_crossmarket/
          if-no-files-found: error
          retention-days: 90
