name: Trading Bollinger EMA SAR V2 Directional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v2_directional_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v2_directional_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v2_directional_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v2-directional.yml'

permissions:
  contents: read
  actions: read

jobs:
  directional-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        direction: ['LONG','SHORT']
        symbol: ['ES.v.0','NQ.v.0','YM.v.0','RTY.v.0']
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      BES_SYMBOL: ${{ matrix.symbol }}
      BES_DIRECTION: ${{ matrix.direction }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install databento pandas numpy
      - name: Compile directional strategy
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v2_directional_backtest.py
      - name: Run isolated direction discovery backtest
        run: python trading_super_strategy/bollinger_ema_sar_v2_directional_backtest.py
      - name: Upload directional evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v2-${{ matrix.direction }}-${{ matrix.symbol }}
          path: bollinger_ema_sar_v2_directional_output/
          if-no-files-found: error
          retention-days: 90

  consolidate:
    needs: directional-backtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy databento
      - name: Download all isolated LONG SHORT artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v2-*
          path: bollinger_ema_sar_v2_directional_downloads
      - name: Compile consolidator
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v2_directional_consolidate.py
      - name: Consolidate LONG and SHORT separately
        run: python trading_super_strategy/bollinger_ema_sar_v2_directional_consolidate.py
      - name: Upload cross-market directional evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v2-directional-crossmarket
          path: bollinger_ema_sar_v2_directional_crossmarket/
          if-no-files-found: error
          retention-days: 90
