name: Recovery Diagnostic Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-diagnostic-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Probe direct and Supavisor recovery connections
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          mkdir -p backups/recovery-diagnostics
          SECRET_PRESENT=false
          DIRECT_READY=false
          DIRECT_DUMP_OK=false
          POOLER_READY=false
          POOLER_DUMP_OK=false
          if [ -n "$SUPABASE_DB_URL" ]; then
            SECRET_PRESENT=true
            psql "$SUPABASE_DB_URL" -Atqc 'select 1' >/dev/null 2>&1
            [ $? -eq 0 ] && DIRECT_READY=true
            pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges --file /tmp/recovery-direct.sql >/dev/null 2>&1
            [ $? -eq 0 ] && [ -s /tmp/recovery-direct.sql ] && DIRECT_DUMP_OK=true

            POOLER_URL=$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse, quote
          raw = os.environ['SUPABASE_DB_URL']
          parsed = urlparse(raw)
          if not parsed.password:
              raise SystemExit(2)
          database = quote(parsed.path.lstrip('/') or 'postgres', safe='')
          password = quote(parsed.password, safe='')
          print(f'postgresql://postgres.koqpyfvnprmirqviafzq:{password}@aws-0-us-east-1.pooler.supabase.com:5432/{database}?sslmode=require')
          PY
            )
            if [ -n "$POOLER_URL" ]; then
              echo "::add-mask::$POOLER_URL"
              psql "$POOLER_URL" -Atqc 'select 1' >/dev/null 2>&1
              [ $? -eq 0 ] && POOLER_READY=true
              pg_dump "$POOLER_URL" --schema-only --no-owner --no-privileges --file /tmp/recovery-pooler.sql >/dev/null 2>&1
              [ $? -eq 0 ] && [ -s /tmp/recovery-pooler.sql ] && POOLER_DUMP_OK=true
            fi
          fi
          printf '{"checked_at_utc":"%s","secret_present":%s,"direct_ready":%s,"direct_pg_dump_ok":%s,"pooler_ready":%s,"pooler_pg_dump_ok":%s}\n' "$(date -u +%FT%TZ)" "$SECRET_PRESENT" "$DIRECT_READY" "$DIRECT_DUMP_OK" "$POOLER_READY" "$POOLER_DUMP_OK" > backups/recovery-diagnostics/latest.json
      - name: Persist diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "contentflow-backup-bot"
          git config user.email "contentflow-backup-bot@users.noreply.github.com"
          git add backups/recovery-diagnostics/latest.json
          git commit -m "diag: compare direct and pooler recovery paths" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
