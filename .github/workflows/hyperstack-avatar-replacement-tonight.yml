name: Hyperstack Avatar Replacement Tonight

on:
  push:
    paths:
      - .github/workflows/hyperstack-avatar-replacement-tonight.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  HYPERSTACK_BASE_URL: https://infrahub-api.nexgencloud.com/v1
  SOURCE_VM_ID: "997313"
  SSH_USER: ubuntu

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Provision replacement with public IP and verify GPU
        shell: bash
        env:
          API_KEY: ${{ secrets.HYPERSTACK_API_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.HYPERSTACK_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$API_KEY"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p evidence ~/.ssh
          KEY_FILE="$HOME/.ssh/hyperstack_avatar"
          printf '%s' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          api_get() {
            local url="$1" out="$2" code
            for n in $(seq 1 12); do
              code=$(curl -sS -o "$out" -w '%{http_code}' "$url" -H "api_key: $API_KEY" -H "accept: application/json" || true)
              [[ "$code" == "200" ]] && return 0
              echo "API GET retry $n http=$code"
              sleep $(( n < 4 ? 5 : 10 ))
            done
            return 1
          }

          api_get "$HYPERSTACK_BASE_URL/core/virtual-machines/$SOURCE_VM_ID" evidence/source-vm.json
          src_status=$(jq -r '.instance.status // "UNKNOWN"' evidence/source-vm.json)
          [[ "$src_status" == "HIBERNATED" ]] || { echo "Source VM must remain HIBERNATED, got $src_status" >&2; exit 3; }

          ENV_NAME=$(jq -r '.instance.environment.name // empty' evidence/source-vm.json)
          IMAGE_NAME=$(jq -r '.instance.image.name // empty' evidence/source-vm.json)
          FLAVOR_NAME=$(jq -r '.instance.flavor.name // empty' evidence/source-vm.json)
          KEY_NAME=$(jq -r '.instance.keypair.name // .instance.keypair // empty' evidence/source-vm.json)
          [[ -n "$KEY_NAME" && "$KEY_NAME" != "null" ]] || KEY_NAME="hyperstack-canada-key"
          test -n "$ENV_NAME"; test -n "$IMAGE_NAME"; test -n "$FLAVOR_NAME"

          NAME="avatar-tonight-$(date -u +%Y%m%d-%H%M%S)"
          jq -n \
            --arg name "$NAME" \
            --arg env "$ENV_NAME" \
            --arg image "$IMAGE_NAME" \
            --arg flavor "$FLAVOR_NAME" \
            --arg key "$KEY_NAME" \
            '{name:$name,environment_name:$env,image_name:$image,flavor_name:$flavor,key_name:$key,count:1,assign_floating_ip:true,security_rules:[{direction:"ingress",protocol:"tcp",port_range_min:22,port_range_max:22,ethertype:"IPv4",remote_ip_prefix:"0.0.0.0/0"}]}' \
            > evidence/create-request.json

          code=$(curl -sS -o evidence/create-response.json -w '%{http_code}' \
            -X POST "$HYPERSTACK_BASE_URL/core/virtual-machines" \
            -H "api_key: $API_KEY" -H "accept: application/json" -H "Content-Type: application/json" \
            --data-binary @evidence/create-request.json || true)
          echo "create http=$code"
          [[ "$code" == "200" || "$code" == "201" || "$code" == "202" ]] || { cat evidence/create-response.json; exit 4; }

          NEW_VM_ID=$(jq -r '.instances[0].id // .instance.id // empty' evidence/create-response.json)
          test -n "$NEW_VM_ID" || { cat evidence/create-response.json; exit 5; }
          echo "$NEW_VM_ID" > evidence/new-vm-id.txt

          cleanup_new_vm() {
            rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "Failure after provisioning; attempting hibernation of replacement VM $NEW_VM_ID"
              curl -sS "$HYPERSTACK_BASE_URL/core/virtual-machines/$NEW_VM_ID/hibernate?retain_ip=true" \
                -H "api_key: $API_KEY" -H "accept: application/json" > evidence/failsafe-hibernate.json || true
            fi
            exit $rc
          }
          trap cleanup_new_vm EXIT

          PUBLIC_IP=""
          for i in $(seq 1 180); do
            if api_get "$HYPERSTACK_BASE_URL/core/virtual-machines/$NEW_VM_ID" evidence/new-vm-poll.json; then
              status=$(jq -r '.instance.status // "UNKNOWN"' evidence/new-vm-poll.json)
              PUBLIC_IP=$(jq -r '.instance.floating_ip // empty' evidence/new-vm-poll.json)
              fip_status=$(jq -r '.instance.floating_ip_status // "UNKNOWN"' evidence/new-vm-poll.json)
              echo "poll $i status=$status fip_status=$fip_status ip=${PUBLIC_IP:-pending}"
              if [[ "$status" == "ACTIVE" && -n "$PUBLIC_IP" ]]; then break; fi
            fi
            sleep 10
          done
          test -n "$PUBLIC_IP" || { echo "Replacement VM failed to obtain public IP" >&2; exit 6; }

          SSH_OK=0
          for i in $(seq 1 30); do
            if ssh -i "$KEY_FILE" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new \
              "$SSH_USER@$PUBLIC_IP" 'echo hyperstack-ssh-ok' > evidence/ssh-probe.txt 2>&1; then
              SSH_OK=1; break
            fi
            echo "ssh retry $i"
            sleep 10
          done
          [[ "$SSH_OK" == "1" ]] || { cat evidence/ssh-probe.txt || true; exit 7; }

          ssh -i "$KEY_FILE" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$PUBLIC_IP" \
            'set -e; echo "=== GPU ==="; nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader; echo "=== CUDA ==="; nvcc --version || true; echo "=== PYTORCH ==="; python3 -c "import torch; print(torch.__version__); print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"NO_GPU\")" 2>/dev/null || echo "PyTorch probe unavailable"' \
            | tee evidence/gpu-probe.txt

          printf 'VM_ID=%s\nPUBLIC_IP=%s\nNAME=%s\n' "$NEW_VM_ID" "$PUBLIC_IP" "$NAME" > evidence/connection.env
          echo "### Hyperstack Avatar replacement READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source VM: $SOURCE_VM_ID (HIBERNATED)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Replacement VM: $NEW_VM_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public IP assigned: yes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSH: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPU probe: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final state: ACTIVE (intentionally left running for tonight)" >> "$GITHUB_STEP_SUMMARY"

          trap - EXIT

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperstack-avatar-replacement-tonight-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
