name: Trading Bollinger EMA SAR Slope Replay V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_slope_replay_v1.py'
      - '.github/workflows/trading-bollinger-ema-sar-slope-replay-v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: python -m pip install pandas numpy
      - name: Download frozen successful slope-study source
        uses: actions/download-artifact@v4
        with:
          name: bes-v1-1-slope-crossmarket
          path: frozen_slope_source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34798849139
      - name: Verify frozen source exists
        run: test -f frozen_slope_source/all_trades.csv
      - name: Run preregistered slope replay
        run: python trading_super_strategy/bollinger_ema_sar_slope_replay_v1.py
      - name: Upload recovered slope-study evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-slope-replay-v1
          path: bollinger_ema_sar_slope_replay_v1_output/
          if-no-files-found: error
          retention-days: 90
