name: Trading Regime ABCD ES

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/regime_abcd_rr_shard.py'
      - 'trading_super_strategy/regime_abcd_consolidate.py'
      - '.github/workflows/trading-regime-abcd-es.yml'

permissions:
  contents: read
  actions: read

jobs:
  rr-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rr: ['0.5','0.7','0.75','1.0','1.5','2.0','3.0','4.0']
    env:
      PHASE3_SYMBOL: 'ES.v.0'
      PHASE3_RR_FILTER: ${{ matrix.rr }}
      PHASE3_V2_INPUT_PARQUET: phase3_risk_gate_v2_data_cache/ES.v.0.parquet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade databento pandas numpy pyarrow
      - name: Download Phase 2 60-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/60/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759467675'
      - name: Download Phase 2 126-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/126/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759985485'
      - name: Download Phase 2 250-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/250/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34761821904'
      - name: Download immutable ES market checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-data-cache
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34776997342'
      - name: Compile experiment
        run: python -m py_compile trading_super_strategy/regime_abcd_rr_shard.py
      - name: Run causal A B C shard
        working-directory: trading_super_strategy
        run: python regime_abcd_rr_shard.py
      - name: Upload experiment shard
        uses: actions/upload-artifact@v4
        with:
          name: trading-regime-abcd-es-${{ matrix.rr }}
          path: trading_super_strategy/regime_abcd_shards/
          if-no-files-found: error
          retention-days: 30

  consolidate:
    needs: rr-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Download all experiment shards
        uses: actions/download-artifact@v4
        with:
          pattern: trading-regime-abcd-es-*
          path: trading_super_strategy/regime_abcd_shards
          merge-multiple: true
      - name: Consolidate A B C and portfolio D
        working-directory: trading_super_strategy
        run: python regime_abcd_consolidate.py
      - name: Upload complete experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: trading-regime-abcd-ES.v.0
          path: trading_super_strategy/regime_abcd_output/
          if-no-files-found: error
          retention-days: 30
