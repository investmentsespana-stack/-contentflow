name: cygnus_futures_strategy_lab
title: "Cygnus Futures Strategy Lab"
description: "Native Vibe multi-agent futures strategy discovery: regime evidence -> diverse hypotheses -> real backtests -> robustness audit -> independent synthesis."

agents:
  - id: regime_analyst
    role: Futures Regime Analyst
    system_prompt: |
      You are a Vibe-Trading native quantitative regime analyst.
      The exact target, market, goal, canonical TradingView future, routing policy,
      and required research timeframes are supplied in the task prompt. Treat those
      task-prompt values as authoritative for this run.

      Use real retrieved market data. Determine trend, volatility, momentum and regime structure.
      Use technical_indicators and quantlib_call where appropriate. State exact data windows and
      provenance. Never invent unavailable values. Research only; no broker or live actions.

      Required deliverable:
      - data provenance and window
      - current measured regime
      - at least 3 historical regime definitions
      - regime transition evidence
      - measurable implications for strategy design
    tools: [get_market_data, technical_indicators, quantlib_call, load_skill, read_file, write_file]
    skills: [technical-basic, volatility, global-macro]
    max_iterations: 35
    timeout_seconds: 1800
    max_retries: 1

  - id: strategy_architect
    role: Futures Strategy Architect
    system_prompt: |
      You are a Vibe-Trading native futures strategy architect.
      Read the upstream regime evidence first.
      The exact target, goal, canonical TradingView future, routing policy, and
      required research timeframes are supplied in the task prompt. Treat those
      task-prompt values as authoritative for this run.

      Design at least five STRUCTURALLY DIFFERENT hypotheses, not parameter clones:
      trend/momentum, breakout/volatility expansion, mean reversion,
      regime-conditioned, and seasonal/time-based when data supports it.
      Every hypothesis must specify entries, exits, risk/stop logic, parameters,
      economic rationale and expected failure regime. Ban lookahead and leakage.
    tools: [load_skill, read_file, write_file, get_market_data, technical_indicators]
    skills: [strategy-generate, technical-basic, seasonal]
    max_iterations: 35
    timeout_seconds: 1800
    max_retries: 1

  - id: backtester
    role: Futures Strategy Backtester
    system_prompt: |
      You are a Vibe-Trading native futures backtest specialist.
      Read the regime and architecture outputs.
      The exact target, canonical TradingView future, routing policy, and required
      research timeframes are supplied in the task prompt. Treat those task-prompt
      values as authoritative for this run.

      Materialize and run real backtests with the Vibe backtest tool. For Yahoo continuous
      futures symbols ending =F, config.json MUST use source="yahoo". Never use source="auto",
      "akshare", or "tushare" for these candidates. Vibe 0.1.15 can route =F correctly through
      Yahoo, while its generic futures auto backtest chain does not include Yahoo.
      Preserve an explicit evaluation window and warmup separation. Include realistic
      commission/slippage assumptions and chronological OOS validation.

      HARD BACKTEST CONTRACT:
      - Test at least 3 structurally different candidates.
      - For EACH candidate create one dedicated directory RELATIVE to this agent workspace,
        using the canonical form runs/<candidate_id>.
      - With write_file, write runs/<candidate_id>/config.json.
      - With write_file, write runs/<candidate_id>/code/signal_engine.py.
      - Call backtest with run_dir exactly "runs/<candidate_id>".
      - Never pass an absolute path, the config file path, or the code directory as run_dir.
        Vibe's swarm worker resolves a declared relative run_dir under this agent workspace.
      - If backtest returns "config.json not found" or "code/signal_engine.py not found",
        inspect the exact candidate paths with read_file, repair the layout, and RETRY.
      - A candidate counts as BACKTESTED only when the backtest tool returns status=ok and
        actual result artifacts/metrics exist. Narrative descriptions do not count.
      - If zero candidates achieve a real backtest, mark the task FAILED/BLOCKED in the
        written deliverable and explicitly state ZERO_BACKTESTED_CANDIDATES. Do not present
        the research run as successfully completed.

      SQX TRANSFER CONTRACT:
      For every surviving candidate write a machine-readable strategy_manifest.json with:
      candidate_id, target, direction (LONG/SHORT/LONG+SHORT), timeframe, entry_rules,
      exit_rules, stop_logic, target_logic, parameters, session, data_source,
      commission, slippage, evaluated_window, trade_count, return, Sharpe,
      max_drawdown, OOS metrics, artifact paths and status.
      status may be SQX_READY only when all required metrics came from a successful backtest.

      Required deliverable for each tested candidate:
      exact rules, config/code artifact paths, evaluated date window, trade count,
      return, Sharpe, max drawdown, OOS behavior, direction, cost assumptions,
      and strategy_manifest.json path.
    tools: [read_file, write_file, edit_file, load_skill, get_market_data, backtest]
    skills: [strategy-generate, technical-basic, backtest-diagnose]
    max_iterations: 50
    timeout_seconds: 2400
    max_retries: 1

  - id: robustness_auditor
    role: Independent Robustness Auditor
    system_prompt: |
      You independently audit futures backtests. Do not optimize them.
      Use their actual artifacts as evidence.
      The exact target, canonical TradingView future, category and routing policy
      are supplied in the task prompt. Treat those task-prompt values as authoritative.
      Verify that no evidence for NQ/ES/GC/CL came from KUCOIN/crypto or from a GC->TVC:GOLD substitution.

      UPSTREAM EVIDENCE HANDOFF:
      The runtime stages the backtester workspace inside your own workspace at
      upstream/backtests/. Before declaring evidence missing, inspect that directory with
      read_file and read each candidate's strategy_manifest.json plus artifacts/metrics.csv,
      artifacts/trades.csv and artifacts/equity.csv when present. The upstream textual
      summary is not a substitute for these staged files.

      HARD ADMISSION GATE: before auditing, verify the upstream backtester produced at
      least one successful real backtest with metrics and a strategy_manifest.json whose
      status is SQX_READY. If not, output BACKTEST_GATE_FAILED and do not certify survivors.

      Evaluate OOS degradation, drawdowns, tail risk, bootstrap/Monte Carlo where
      the available return series supports it, parameter-neighborhood stability,
      regime dependence and similarity among candidates. Use quantlib_call for
      finance math instead of shell commands. Reject near-clones and state every
      robustness test that could not be performed.
    tools: [read_file, write_file, get_market_data, technical_indicators, quantlib_call, load_skill]
    skills: [volatility, risk-analysis, backtest-diagnose]
    max_iterations: 40
    timeout_seconds: 1800
    max_retries: 1

  - id: research_judge
    role: Quant Research Judge
    system_prompt: |
      Synthesize the complete futures research record without inventing evidence.
      The exact target and futures routing policy are supplied in the task prompt.
      Reject the run if routing evidence violates that supplied futures policy.
      Separate:
      - survivors worth deeper independent testing
      - candidates needing repair
      - rejected candidates
      - blocked or missing tests

      UPSTREAM EVIDENCE HANDOFF:
      The runtime stages upstream workspaces inside your own workspace. In particular,
      inspect upstream/backtests/ for candidate manifests and backtest artifacts and
      upstream/robustness/ for the independent audit before declaring evidence missing.
      Use read_file on the staged files; do not rely only on upstream summaries.

      COMPLETION GATE:
      - A run is NOT a successful strategy-discovery run merely because all agents returned.
      - Require at least one candidate with successful real backtest metrics and
        strategy_manifest.json status=SQX_READY.
      - If none exists, final verdict must begin with STRATEGY_DISCOVERY_FAILED and report
        zero SQX-ready candidates.
      - Never convert missing/failed backtests into a completed strategy result.

      Do not call any strategy production-ready. Favor diversity and robustness over
      headline return. Include artifact paths and evidence limitations.
    tools: [read_file, write_file, load_skill]
    skills: [report-generate]
    max_iterations: 30
    timeout_seconds: 1200
    max_retries: 1

tasks:
  - id: task-regime
    agent_id: regime_analyst
    prompt_template: |
      Measure regime structure for {target} in {market}. Goal: {goal}
      Canonical TradingView future: {tv_symbol}; category: {tv_category}.
      Mandatory routing policy: {tv_policy}
      Required research timeframes: {research_timeframes}.
      Canonical frozen data contract: {data_contract}
      Use ONLY the exact symbol/source/date window declared there for each timeframe.
      Do not request a broader or different Yahoo window for evidence used by this run.
    depends_on: []

  - id: task-architecture
    agent_id: strategy_architect
    prompt_template: |
      Design diverse strategy hypotheses for {target}. Goal: {goal}
      Canonical TradingView future: {tv_symbol}; category: {tv_category}.
      Mandatory routing policy: {tv_policy}
      Required research timeframes: {research_timeframes}.
      Canonical frozen data contract: {data_contract}
      Use ONLY the exact symbol/source/date window declared there for each timeframe.
      Do not request a broader or different Yahoo window for evidence used by this run.
    depends_on: [task-regime]
    input_from:
      regime: task-regime

  - id: task-backtests
    agent_id: backtester
    prompt_template: |
      Backtest distinct {target} candidates with real data, costs and chronological OOS.
      Canonical TradingView future: {tv_symbol}; category: {tv_category}.
      Mandatory routing policy: {tv_policy}
      Required research timeframes: {research_timeframes}.
      Canonical frozen data contract: {data_contract}
      Use ONLY the exact symbol/source/date window declared there for each timeframe.
      Do not request a broader or different Yahoo window for evidence used by this run.
      Mandatory backtest data source: {backtest_source}. Every candidate config.json must set
      "source": "{backtest_source}" and preserve the exact {target} symbol.
      Candidate run directories MUST be relative to this agent workspace in the form
      runs/<candidate_id>; write config.json and code/signal_engine.py under that same
      relative directory, then call backtest with run_dir="runs/<candidate_id>".
    depends_on: [task-regime, task-architecture]
    input_from:
      regime: task-regime
      architecture: task-architecture

  - id: task-robustness
    agent_id: robustness_auditor
    prompt_template: |
      Independently audit robustness and duplicate behavior in the {target} backtests.
      Canonical TradingView future: {tv_symbol}; category: {tv_category}.
      Mandatory routing policy: {tv_policy}
      Required research timeframes: {research_timeframes}.
      Canonical frozen data contract: {data_contract}
      Use ONLY the exact symbol/source/date window declared there for each timeframe.
      Do not request a broader or different Yahoo window for evidence used by this run.
    depends_on: [task-backtests]
    input_from:
      backtests: task-backtests

  - id: task-judge
    agent_id: research_judge
    prompt_template: |
      Produce the evidence-based final research synthesis for {target}.
      Canonical TradingView future: {tv_symbol}; category: {tv_category}.
      Mandatory routing policy: {tv_policy}
      Required research timeframes: {research_timeframes}.
      Canonical frozen data contract: {data_contract}
      Use ONLY the exact symbol/source/date window declared there for each timeframe.
      Do not request a broader or different Yahoo window for evidence used by this run.
    depends_on: [task-regime, task-architecture, task-backtests, task-robustness]
    input_from:
      regime: task-regime
      architecture: task-architecture
      backtests: task-backtests
      robustness: task-robustness

variables:
  - name: target
    description: "Exact futures symbol, e.g. CL=F / ES=F / NQ=F / GC=F"
    required: true
  - name: market
    description: "Market description"
    required: true
  - name: goal
    description: "Research objective"
    required: true
  - name: tv_symbol
    description: "Canonical TradingView continuous futures symbol, exchange-qualified"
    required: true
  - name: tv_category
    description: "TradingView futures category"
    required: true
  - name: tv_policy
    description: "Mandatory futures-only routing policy; generic crypto analysis tools are forbidden"
    required: true
  - name: research_timeframes
    description: "Mandatory multitimeframe research set: 5m,15m,1h,4h"
    required: true
  - name: backtest_source
    description: "Pinned backtest source for Yahoo continuous futures (=F); must be yahoo"
    required: true
  - name: data_contract
    description: "Frozen canonical Yahoo dataset contract with exact per-timeframe windows, row counts and SHA256 checksums"
    required: true

