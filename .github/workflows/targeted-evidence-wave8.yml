name: targeted-evidence-wave8
on:
  pull_request:
    paths:
      - '.github/workflows/targeted-evidence-wave8.yml'
      - 'src/guardrails/evidence-wave8-capabilities.ts'
      - 'tests/evidence-wave8-capabilities.spec.ts'
      - 'src/guardrails/output-claim-rejection-report.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted-evidence-wave8.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - requirement_id: '59'
            builder_run_id: '2126'
            task_key: 'arch_guardrail_input_boundary_secrets_pii_scan_integrate_rejection_handler'
            profile: 'static-analysis'
            property: 'secret_pii_rejection_handler'
          - requirement_id: '90'
            builder_run_id: '3652'
            task_key: 'arch_guardrail_deploy_completion_boundary_approval_check_fix_implement_platform_store_interface_inte'
            profile: 'static-analysis'
            property: 'no_direct_storage_instantiation'
          - requirement_id: '180209'
            builder_run_id: '3841'
            task_key: 'arch_guardrail_output_review_boundary_claim_verifiability_check_generate_rejection_report'
            profile: 'source-contract'
            property: 'real_rejection_report_contract'
          - requirement_id: '48'
            builder_run_id: '2083'
            task_key: 'arch_guardrail_output_review_boundary_quality_gate_integration_coherence_check_fix_integrate_with_pl'
            profile: 'runtime-test'
            property: 'dynamic_timestamp_schema'
          - requirement_id: '50'
            builder_run_id: '2092'
            task_key: 'arch_guardrail_output_review_boundary_quality_gate_integration_violation_logging'
            profile: 'runtime-test'
            property: 'quality_violation_logging'
          - requirement_id: '56'
            builder_run_id: '2116'
            task_key: 'arch_guardrail_output_review_boundary_quality_gate_integration_violation_logging_implement_violation'
            profile: 'runtime-test'
            property: 'json_logger_transport'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run deterministic wave8 capability suite
        run: npx playwright test tests/evidence-wave8-capabilities.spec.ts --project=chromium --workers=1
      - name: Produce sanitized payload
        env:
          PROPERTY: ${{ matrix.property }}
        run: node -e 'const fs=require("fs");fs.writeFileSync("/tmp/evidence-wave8.json",JSON.stringify({passed:true,suite:"evidence-wave8-low-risk-closures",property:process.env.PROPERTY,test_file:"tests/evidence-wave8-capabilities.spec.ts",source:"src/guardrails/evidence-wave8-capabilities.ts"}))'
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-wave8-${{ matrix.requirement_id }}
          path: /tmp/evidence-wave8.json
          retention-days: 14
      - name: Install PostgreSQL 17 client
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Persist correlated PASS and reconcile
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REQUIREMENT_ID: ${{ matrix.requirement_id }}
          BUILDER_RUN_ID: ${{ matrix.builder_run_id }}
          TASK_KEY: ${{ matrix.task_key }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGHOST=aws-0-us-east-1.pooler.supabase.com PGPORT=5432 PGUSER=postgres.koqpyfvnprmirqviafzq PGDATABASE=postgres
          export BASE_PAYLOAD="$(cat /tmp/evidence-wave8.json)"
          export CI_PAYLOAD="$(node -e 'const b=JSON.parse(process.env.BASE_PAYLOAD);process.stdout.write(JSON.stringify({...b,repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,workflow_run_id:process.env.GITHUB_RUN_ID,produced_at:new Date().toISOString()}))')"
          psql -v ON_ERROR_STOP=1 -v requirement_id="$REQUIREMENT_ID" -v builder_run_id="$BUILDER_RUN_ID" -v task_key="$TASK_KEY" -v profile="$PROFILE" -v commit_sha="$GITHUB_SHA" -v workflow_run_id="$GITHUB_RUN_ID" -v payload="$CI_PAYLOAD" <<'SQL'
          select public.contentflow_record_ci_requirement_evidence(:'requirement_id'::bigint,:'builder_run_id'::bigint,:'task_key',:'profile',:'commit_sha',:'workflow_run_id',:'payload'::jsonb);
          select public.contentflow_reconcile_ci_requirement_evidence('contentflow');
          SQL
