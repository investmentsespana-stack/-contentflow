name: Trading Phase 3 Risk Gate V2 ES Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/phase3_risk_gate_v2_resilient.py'
      - 'trading_super_strategy/phase3_risk_gate_v2_data_cache.py'
      - 'trading_super_strategy/phase3_risk_gate_v2_cached_runner.py'
      - '.github/workflows/trading-phase3-risk-gate-v2-es-recovery.yml'

permissions:
  contents: read
  actions: read

jobs:
  download-es-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      PHASE3_SYMBOL: 'ES.v.0'
      PHASE3_START_DATE: '2022-09-01'
      PHASE3_END_DATE: '2025-09-24'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transport dependencies
        run: python -m pip install --upgrade databento pandas pyarrow

      - name: Compile resilient data cache
        run: |
          python -m py_compile trading_super_strategy/phase3_risk_gate_v2_resilient.py
          python -m py_compile trading_super_strategy/phase3_risk_gate_v2_data_cache.py

      - name: Download and persist ES validation data
        working-directory: trading_super_strategy
        run: python phase3_risk_gate_v2_data_cache.py

      - name: Upload immutable ES data checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-data-cache
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache/
          if-no-files-found: error
          retention-days: 30

  calculate-es-risk-gate-v2:
    needs: download-es-data
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      PHASE3_SYMBOL: 'ES.v.0'
      PHASE3_START_DATE: '2022-09-01'
      PHASE3_END_DATE: '2025-09-24'
      PHASE3_COST_R: '0.03'
      PHASE3_MIN_TRADES: '60'
      PHASE3_MIN_FOLD_TRADES: '5'
      PHASE3_MIN_FOLDS: '3'
      PHASE3_MIN_POSITIVE_FOLD_RATE: '0.60'
      PHASE3_V2_MC_ITERATIONS: '2000'
      PHASE3_V2_BLOCK_LENGTHS: '5,20'
      PHASE3_V2_CAPITAL_DD_BUDGET: '0.10'
      PHASE3_V2_PRIMARY_PROFILE: 'conservative_025pct'
      PHASE3_V2_MAX_RUIN_PROB: '0.01'
      PHASE3_V2_DSR_THRESHOLD: '0.95'
      PHASE3_V2_SURVIVOR_POOL_TRIALS: '165'
      PHASE3_V2_FULL_SEARCH_TRIALS: '833140'
      PHASE3_V2_PBO_MAX: '0.50'
      PHASE3_V2_INPUT_PARQUET: 'phase3_risk_gate_v2_data_cache/ES.v.0.parquet'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install calculation dependencies
        run: python -m pip install --upgrade databento pandas pyarrow

      - name: Download Phase 2 60-session survivor artifact
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/60/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759467675'

      - name: Download Phase 2 126-session survivor artifact
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/126/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759985485'

      - name: Download Phase 2 250-session survivor artifact
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/250/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34761821904'

      - name: Download ES data checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-data-cache
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache

      - name: Compile cached Risk Gate V2
        run: |
          python -m py_compile trading_super_strategy/phase3_risk_gate_v2.py
          python -m py_compile trading_super_strategy/phase3_risk_gate_v2_cached_runner.py

      - name: Run ES Risk Gate V2 from checkpoint
        working-directory: trading_super_strategy
        run: python phase3_risk_gate_v2_cached_runner.py

      - name: Upload Phase 3 V2 ES recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-recovery
          path: trading_super_strategy/phase3_risk_gate_v2_output/
          if-no-files-found: warn
          retention-days: 30
