name: panel-qa-v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'projects/**'
      - 'docs/architecture/**'
      - 'supabase/functions/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/panel-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'src/**'
      - 'projects/**'
      - 'docs/architecture/**'
      - 'supabase/functions/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/panel-qa.yml'

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Static typecheck approval crypto contract
        run: npm run typecheck:approval-crypto
      - name: Validate shared Director foundation
        run: npm run test:director-foundation
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} QA
        env:
          CONTENTFLOW_BASE_URL: https://contentflow-ai-tan.vercel.app
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-qa-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
