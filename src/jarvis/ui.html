<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jarvis Desktop</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef7ff}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{border-right:1px solid #1e3a52;padding:20px;background:#0a1626}.brand{font-size:24px;font-weight:800;letter-spacing:.08em}.muted{color:#8da6b8;font-size:13px}.status{margin-top:24px;display:grid;gap:10px}.card{background:#0e2032;border:1px solid #203f57;border-radius:14px;padding:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#607d8b;margin-right:8px}.dot.on{background:#59d18c}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{padding:16px 22px;border-bottom:1px solid #1e3a52;display:flex;gap:10px;align-items:center}.tab{border:1px solid #294d69;background:#0c1b2b;color:#cfe9fa;border-radius:999px;padding:9px 14px;cursor:pointer}.tab.active{background:#123b5a;color:white}.messages{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:780px;padding:13px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.user{align-self:flex-end;background:#14537a}.assistant{align-self:flex-start;background:#10283d;border:1px solid #244a65}.composer{padding:16px 22px;border-top:1px solid #1e3a52;display:grid;grid-template-columns:auto 1fr auto;gap:10px}.composer textarea{resize:none;min-height:52px;max-height:150px;background:#0b1b2b;color:white;border:1px solid #294d69;border-radius:14px;padding:14px;font:inherit}.btn{border:0;border-radius:14px;padding:0 18px;background:#1b86c8;color:white;font-weight:700;cursor:pointer}.mic{width:52px;background:#142f45}.log{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;max-height:230px;overflow:auto}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">JARVIS</div><div class="muted">Desktop Command Center</div>
  <div class="status">
    <div class="card"><div><span id="aiDot" class="dot"></span>OpenAI</div><div id="aiText" class="muted">comprobando…</div></div>
    <div class="card"><div><span id="dirDot" class="dot"></span>Director</div><div id="dirText" class="muted">comprobando…</div></div>
    <div class="card"><strong>Estado Director</strong><div id="directorStatus" class="log muted">Sin datos</div></div>
  </div>
</aside>
<main class="main">
  <div class="top"><button class="tab active" data-mode="chat">Hablar con ChatGPT</button><button class="tab" data-mode="director">Director / Orquestador</button><span class="muted" id="modeHelp">Conversación normal</span></div>
  <section class="messages" id="messages"><div class="msg assistant">Jarvis listo. Puedes conversar conmigo o cambiar al canal Director para enviar una orden operativa.</div></section>
  <div class="composer"><button class="btn mic" id="mic" title="Hablar">🎙</button><textarea id="input" placeholder="Escribe o dicta una instrucción…"></textarea><button class="btn" id="send">Enviar</button></div>
</main>
</div>
<script>
let mode='chat';
const history=[];
const $=(id)=>document.getElementById(id);
function add(text,who='assistant'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;}
async function health(){try{const r=await fetch('/health');const h=await r.json();$('aiDot').classList.toggle('on',h.openaiConfigured);$('dirDot').classList.toggle('on',h.directorConfigured);$('aiText').textContent=h.openaiConfigured?'configurado':'falta OPENAI_API_KEY';$('dirText').textContent=h.directorConfigured?'configurado':'falta DIRECTOR_BASE_URL';if(h.directorConfigured) directorStatus();}catch(e){$('aiText').textContent='sin conexión local';}}
async function directorStatus(){try{const r=await fetch('/api/director/status');const b=await r.json();$('directorStatus').textContent=JSON.stringify(b,null,2);}catch(e){$('directorStatus').textContent='No disponible';}}
async function send(){const text=$('input').value.trim();if(!text)return;$('input').value='';add(text,'user');$('send').disabled=true;try{if(mode==='chat'){history.push({role:'user',content:text});const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:history})});const b=await r.json();if(!r.ok)throw new Error(b.error||'error');history.push({role:'assistant',content:b.reply});add(b.reply);}else{const r=await fetch('/api/director/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command:text})});const b=await r.json();if(!r.ok)throw new Error(b.error||'error');add('Director:\n'+JSON.stringify(b,null,2));directorStatus();}}catch(e){add('Error: '+e.message);}finally{$('send').disabled=false;$('input').focus();}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('modeHelp').textContent=mode==='chat'?'Conversación normal':'Las instrucciones se envían al Director real';});
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.onresult=e=>{$('input').value=e.results[0][0].transcript;};$('mic').onclick=()=>rec.start();}else{$('mic').disabled=true;$('mic').title='Reconocimiento de voz no disponible en este navegador';}
health();setInterval(()=>{if(mode==='director')directorStatus();},15000);
</script>
</body>
</html>
