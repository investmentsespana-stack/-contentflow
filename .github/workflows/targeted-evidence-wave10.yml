name: targeted-evidence-wave10
on:
  pull_request:
    paths:
      - '.github/workflows/targeted-evidence-wave10.yml'
      - 'src/platform/approval-crypto-validator.ts'
      - 'src/platform/platform_store.py'
      - 'tests/approval-crypto-e2e.spec.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted-evidence-wave10.yml'
      - 'src/platform/approval-crypto-validator.ts'
      - 'src/platform/platform_store.py'
      - 'tests/approval-crypto-e2e.spec.ts'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - requirement_id: '54'
            builder_run_id: '2108'
            task_key: 'arch_guardrail_deploy_completion_boundary_approval_check_fix_validate_crypto_approval_integrate_and_'
            profile: 'runtime-test'
            property: 'tampered_record_rejected_with_reason'
          - requirement_id: '57'
            builder_run_id: '2118'
            task_key: 'arch_guardrail_deploy_completion_boundary_approval_check_fix_validate_crypto_approval_implement_sign'
            profile: 'runtime-test'
            property: 'valid_invalid_signature_and_throughput'
          - requirement_id: '94'
            builder_run_id: '3658'
            task_key: 'arch_guardrail_deploy_completion_boundary_approval_check_fix_implement_platform_store_interface_defi'
            profile: 'source-contract'
            property: 'typed_platform_store_approval_contract'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - name: Static typecheck real approval crypto contract
        run: npm run typecheck:approval-crypto
      - name: Typecheck approval PlatformStore protocol
        run: |
          python -m pip install --disable-pip-version-check mypy==1.17.1
          mypy --strict src/platform/platform_store.py
      - name: Run real Ed25519 approval ingestion tests
        run: npx playwright test tests/approval-crypto-e2e.spec.ts --project=chromium --workers=1
      - name: Produce sanitized cryptographic evidence payload
        env:
          PROPERTY: ${{ matrix.property }}
        run: node -e 'const fs=require("fs");fs.writeFileSync("/tmp/evidence-wave10.json",JSON.stringify({passed:true,suite:"approval-crypto-real-validation",property:process.env.PROPERTY,test_file:"tests/approval-crypto-e2e.spec.ts",sources:["src/platform/approval-crypto-validator.ts","src/platform/platform_store.py"],algorithm:"Ed25519+SHA-256",privateKeyPersisted:false,secretValuesExposed:false}))'
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-wave10-${{ matrix.requirement_id }}
          path: /tmp/evidence-wave10.json
          retention-days: 14
      - name: Install PostgreSQL 17 client
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Persist correlated PASS and reconcile
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REQUIREMENT_ID: ${{ matrix.requirement_id }}
          BUILDER_RUN_ID: ${{ matrix.builder_run_id }}
          TASK_KEY: ${{ matrix.task_key }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGHOST=aws-0-us-east-1.pooler.supabase.com PGPORT=5432 PGUSER=postgres.koqpyfvnprmirqviafzq PGDATABASE=postgres
          export BASE_PAYLOAD="$(cat /tmp/evidence-wave10.json)"
          export CI_PAYLOAD="$(node -e 'const b=JSON.parse(process.env.BASE_PAYLOAD);process.stdout.write(JSON.stringify({...b,repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,workflow_run_id:process.env.GITHUB_RUN_ID,produced_at:new Date().toISOString()}))')"
          psql -v ON_ERROR_STOP=1 -v requirement_id="$REQUIREMENT_ID" -v builder_run_id="$BUILDER_RUN_ID" -v task_key="$TASK_KEY" -v profile="$PROFILE" -v commit_sha="$GITHUB_SHA" -v workflow_run_id="$GITHUB_RUN_ID" -v payload="$CI_PAYLOAD" <<'SQL'
          select public.contentflow_record_ci_requirement_evidence(:'requirement_id'::bigint,:'builder_run_id'::bigint,:'task_key',:'profile',:'commit_sha',:'workflow_run_id',:'payload'::jsonb);
          select public.contentflow_reconcile_ci_requirement_evidence('contentflow');
          SQL
