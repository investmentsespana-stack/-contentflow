name: Trading Bollinger EMA SAR V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v3_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v3_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v3_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v3.yml'

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['ES.v.0','NQ.v.0','YM.v.0','RTY.v.0']
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      BES_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade databento pandas numpy
      - name: Compile V1 base and V3 strategy
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_backtest.py trading_super_strategy/bollinger_ema_sar_v3_backtest.py
      - name: Run V3 discovery-only 1m backtest
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v3_backtest.py
      - name: Upload V3 market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v3-${{ matrix.symbol }}
          path: trading_super_strategy/bollinger_ema_sar_v3_output/
          if-no-files-found: error
          retention-days: 30

  consolidate:
    needs: backtest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download all V3 market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v3-*
          path: trading_super_strategy/bollinger_ema_sar_v3_downloads
      - name: Consolidate V3 cross-market results
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v3_consolidate.py
      - name: Upload V3 cross-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v3-crossmarket
          path: trading_super_strategy/bollinger_ema_sar_v3_crossmarket/
          if-no-files-found: error
          retention-days: 30
