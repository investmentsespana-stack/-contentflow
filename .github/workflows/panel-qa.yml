name: panel-qa-v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'projects/**'
      - 'experiments/**'
      - 'docs/architecture/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'certification-evidence/**'
      - '.github/scripts/**'
      - '.github/workflows/daily-recovery-snapshot.yml'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/panel-qa.yml'
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  director-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Static typecheck approval crypto contract
        run: npm run typecheck:approval-crypto
      - name: Validate shared Director foundation
        run: npm run test:director-foundation
      - name: Certify Director portability across ContentFlow and OPC
        run: npm run test:director-portability
      - name: Certify SDC isolation and cross-director denial
        run: npm run test:sdc-matrix
      - name: Certify SDC boundary enforcement
        run: npm run test:sdc-enforcement
      - name: Certify Director observability contract
        run: npm run test:director-observability
      - name: Certify worker admission gate
        run: npm run test:worker-admission
      - name: Certify autonomy authority envelope
        run: npm run test:autonomy-authority
      - name: Certify recovery trust chain
        run: npm run test:recovery-trust-chain
      - name: Certify recovery promotion ledger
        run: npm run test:recovery-promotion

  browser-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser QA
        run: npx playwright test --project=${{ matrix.browser }}
