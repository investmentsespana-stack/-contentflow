name: targeted-evidence-wave3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/targeted-evidence-wave3.yml'
      - 'schemas/input_contract.v1.schema.json'
      - 'src/shared/contentflow_evidence_checker.py'
      - 'tests/test_contentflow_evidence_checker.py'
      - 'scripts/contentflow_irreversible_scanner.py'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted-evidence-wave3.yml'

permissions:
  contents: read

concurrency:
  group: targeted-evidence-wave3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Run evidence checker tests
        run: pytest -q tests/test_contentflow_evidence_checker.py

      - name: Validate input contract against 30 positive cases
        shell: bash
        run: |
          python - <<'PY'
          import json, uuid
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.loads(Path('schemas/input_contract.v1.schema.json').read_text())
          validator=Draft202012Validator(schema, format_checker=FormatChecker())
          cases=[{
              'resource_id': f'resource_{i}',
              'worker_id': f'worker_{i}',
              'idempotency_key': str(uuid.uuid4()),
              'ttl_seconds': 30 + (i % 5),
          } for i in range(30)]
          for idx,case in enumerate(cases):
              errors=list(validator.iter_errors(case))
              if errors:
                  raise SystemExit(f'positive_case_{idx}_failed: {errors[0].message}')
          required=set(schema.get('required', []))
          assert {'resource_id','worker_id','idempotency_key'} <= required
          print(json.dumps({'passed':True,'positive_cases':len(cases),'required_fields':sorted(required)}))
          PY

      - name: Execute irreversible scanner on real deployment artifacts
        shell: bash
        run: |
          python scripts/contentflow_irreversible_scanner.py supabase/migrations > /tmp/irreversible-report.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/irreversible-report.json'))
          assert isinstance(report, list)
          for finding in report:
              assert {'file_path','line_number','operation_type'} <= set(finding)
              assert isinstance(finding['line_number'], int) and finding['line_number'] > 0
          print(json.dumps({'passed':True,'target':'supabase/migrations','finding_count':len(report),'report':report[:50]}))
          PY

      - name: Install PostgreSQL 17 client
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Persist correlated evidence in Supabase
        if: github.event_name == 'push'
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require
          export PGHOST=aws-0-us-east-1.pooler.supabase.com
          export PGPORT=5432
          export PGUSER=postgres.koqpyfvnprmirqviafzq
          export PGDATABASE=postgres
          CHECKER_PAYLOAD="$(python -c 'import json,os; print(json.dumps({"passed":True,"suite":"contentflow-evidence-checker","test_file":"tests/test_contentflow_evidence_checker.py","cases":["empty","partial","full","malformed-empty"],"repository":os.environ["GITHUB_REPOSITORY"],"sha":os.environ["GITHUB_SHA"],"workflow":os.environ["GITHUB_WORKFLOW"],"workflow_run_id":os.environ["GITHUB_RUN_ID"]}))')"
          CONTRACT_PAYLOAD="$(python -c 'import json,os; print(json.dumps({"passed":True,"suite":"input-contract-positive-cases","schema":"schemas/input_contract.v1.schema.json","positive_cases":30,"required_fields":["resource_id","worker_id","idempotency_key"],"repository":os.environ["GITHUB_REPOSITORY"],"sha":os.environ["GITHUB_SHA"],"workflow":os.environ["GITHUB_WORKFLOW"],"workflow_run_id":os.environ["GITHUB_RUN_ID"]}))')"
          SCANNER_PAYLOAD="$(python -c 'import json,os; report=json.load(open("/tmp/irreversible-report.json")); print(json.dumps({"passed":True,"suite":"irreversible-mutation-scanner","target":"supabase/migrations","finding_count":len(report),"report":report[:50],"repository":os.environ["GITHUB_REPOSITORY"],"sha":os.environ["GITHUB_SHA"],"workflow":os.environ["GITHUB_WORKFLOW"],"workflow_run_id":os.environ["GITHUB_RUN_ID"]}))')"
          psql -v ON_ERROR_STOP=1 \
            -v commit_sha="$GITHUB_SHA" \
            -v workflow_run_id="$GITHUB_RUN_ID" \
            -v checker_payload="$CHECKER_PAYLOAD" \
            -v contract_payload="$CONTRACT_PAYLOAD" \
            -v scanner_payload="$SCANNER_PAYLOAD" \
            <<'SQL'
          select public.contentflow_record_ci_requirement_evidence(45,2061,'arch_guardrail_output_review_boundary_completion_prohibition_no_evidence_evidence_validato_fix_imple','runtime-test',:'commit_sha',:'workflow_run_id',:'checker_payload'::jsonb);
          select public.contentflow_record_ci_requirement_evidence(60,2131,'arch_guardrail_input_boundary_unverified_assumptions_enforce_contract_compliance_define_contract_sch','runtime-test',:'commit_sha',:'workflow_run_id',:'contract_payload'::jsonb);
          select public.contentflow_record_ci_requirement_evidence(44,1961,'arch_guardrail_deploy_completion_boundary_destructive_changes_guard_fix_detect_irreversible_operatio','runtime-test',:'commit_sha',:'workflow_run_id',:'scanner_payload'::jsonb);
          select public.contentflow_reconcile_ci_requirement_evidence('contentflow');
          SQL
