name: Jarvis Desktop Certification

on:
  pull_request:
    paths:
      - 'src/jarvis/**'
      - 'tests/jarvis-desktop.test.mjs'
      - 'docs/jarvis-desktop.md'
      - 'package.json'
      - '.github/workflows/jarvis-desktop-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Jarvis smoke test
        run: npm run test:jarvis
