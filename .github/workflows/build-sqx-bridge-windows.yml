name: Build SQX Bridge Windows

on:
  workflow_dispatch:
  push:
    branches: [main, fix/sqx-build142-cli-bridge]
    paths:
      - 'trading_super_strategy/sqx_bridge/**'
      - '.github/workflows/build-sqx-bridge-windows.yml'
  pull_request:
    paths:
      - 'trading_super_strategy/sqx_bridge/**'
      - '.github/workflows/build-sqx-bridge-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r trading_super_strategy/sqx_bridge/requirements.txt pyinstaller
      - name: Compile source
        shell: pwsh
        run: python -m py_compile trading_super_strategy/sqx_bridge/app.py

      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          $files = @(
            'trading_super_strategy/sqx_bridge/Install-ResearchV5.ps1',
            'trading_super_strategy/sqx_bridge/Install-ResearchV6.ps1',
            'trading_super_strategy/sqx_bridge/Install-LiveTelemetryV61.ps1',
            'trading_super_strategy/vibe_trading/install_vibe_trading_research.ps1',
            'trading_super_strategy/vibe_trading/Test-NQ6FrozenWithVibe.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Test startup certification gate
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_startup_gate.py

      - name: Test live HTTP telemetry attach
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_live_http_telemetry.py

      - name: Test futures resource repair
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_resource_repair.py
      - name: Test fixed Vibe NQ6 research gate
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_vibe_nq6_bridge_gate.py
      - name: Compile multi-asset Vibe runner
        shell: pwsh
        run: python -m py_compile trading_super_strategy/vibe_trading/asset_research.py
      - name: Test fixed Vibe multi-asset research gate
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_vibe_asset_bridge_gate.py
      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CygnusSQXBridge `
            --collect-all keyring `
            trading_super_strategy/sqx_bridge/app.py
      - name: Create distribution README
        shell: pwsh
        run: |
          @"
          CYGNUS SQX BRIDGE - STRATEGYQUANT BUILD 142

          RESEARCH V6.1 LIVE TELEMETRY UPDATE

          Preferred telemetry repair: double-click INSTALL_LIVE_TELEMETRY_V61.cmd.
          V6.1 preserves pairing, replaces only the Bridge, and attaches read-only
          status/databank telemetry to an already-running SQX Build 142 process
          through the loopback HTTP API. It does NOT stop SQX or GOLD.

          Base V6: double-click INSTALL_RESEARCH_V6.cmd.
          V6 preserves pairing and enables fixed Vibe research for NQ, ES, CL, GC and DXY.
          V5 remains packaged only for backward recovery.

          Legacy V5: double-click INSTALL_RESEARCH_V5.cmd.
          It preserves the existing Bridge pairing, installs Vibe in RESEARCH_ONLY,
          starts local-only Vibe MCP, replaces Bridge v4 with v5, and lets the
          already-queued fixed NQ6 smoke command execute automatically.

          Safety: LIVE=false, shell tools disabled, no broker execution,
          smoke test does not invoke StrategyQuant.
          "@ | Out-File -Encoding utf8 dist/LEEME.txt
      - name: Assemble one-click research v5 kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\vibe\data | Out-Null
          Copy-Item trading_super_strategy\sqx_bridge\Install-ResearchV5.ps1 dist\Install-ResearchV5.ps1
          Copy-Item trading_super_strategy\sqx_bridge\INSTALL_RESEARCH_V5.cmd dist\INSTALL_RESEARCH_V5.cmd
          Copy-Item trading_super_strategy\sqx_bridge\Install-ResearchV6.ps1 dist\Install-ResearchV6.ps1
          Copy-Item trading_super_strategy\sqx_bridge\INSTALL_RESEARCH_V6.cmd dist\INSTALL_RESEARCH_V6.cmd
          Copy-Item trading_super_strategy\sqx_bridge\Install-LiveTelemetryV61.ps1 dist\Install-LiveTelemetryV61.ps1
          Copy-Item trading_super_strategy\sqx_bridge\INSTALL_LIVE_TELEMETRY_V61.cmd dist\INSTALL_LIVE_TELEMETRY_V61.cmd
          Copy-Item trading_super_strategy\vibe_trading\install_vibe_trading_research.ps1 dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\verify_vibe_trading_research.ps1 dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\README.md dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\nq6_frozen_vibe_smoke.py dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\Test-NQ6FrozenWithVibe.ps1 dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\nq6_frozen_inventory.json dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\asset_research.py dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_single_asset_strategy_desk.yaml dist\vibe\
          Copy-Item trading_super_strategy\vibe_trading\data\nq6_frozen_manifest.json dist\vibe\data\

      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: Cygnus-SQX-Bridge-Windows-Build142
          path: dist/
          if-no-files-found: error
          retention-days: 30
