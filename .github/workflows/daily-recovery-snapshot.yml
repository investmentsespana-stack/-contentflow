name: Daily ContentFlow Recovery Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-recovery-snapshot.yml'
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-contentflow-recovery-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify backup secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL secret is required for automated recovery snapshots."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve reachable database URL
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if psql "$SUPABASE_DB_URL" -Atqc 'select 1' >/dev/null 2>&1; then
            echo 'Using configured database endpoint.'
            echo "EFFECTIVE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          POOLER_URL=$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse, quote
          raw = os.environ['SUPABASE_DB_URL']
          parsed = urlparse(raw)
          if not parsed.password:
              raise SystemExit('SUPABASE_DB_URL does not contain a database password')
          database = parsed.path.lstrip('/') or 'postgres'
          password = quote(parsed.password, safe='')
          database = quote(database, safe='')
          print(f'postgresql://postgres.koqpyfvnprmirqviafzq:{password}@aws-0-us-east-1.pooler.supabase.com:5432/{database}?sslmode=require')
          PY
          )
          echo "::add-mask::$POOLER_URL"
          if ! psql "$POOLER_URL" -Atqc 'select 1' >/dev/null 2>&1; then
            echo 'Neither the configured endpoint nor the Supavisor session pooler is reachable with the stored credentials.'
            exit 1
          fi
          echo 'Using Supavisor session pooler fallback.'
          echo "EFFECTIVE_DB_URL=$POOLER_URL" >> "$GITHUB_ENV"

      - name: Create dated recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          DIR="backups/${DAY}"
          mkdir -p "$DIR"

          pg_dump "$EFFECTIVE_DB_URL" \
            --schema-only \
            --no-owner \
            --no-privileges \
            --file "$DIR/schema.sql"

          pg_dump "$EFFECTIVE_DB_URL" \
            --data-only \
            --column-inserts \
            --no-owner \
            --no-privileges \
            --table=public.director_control_policy \
            --table=public.director_operating_rules \
            --table=public.director_repair_recipes \
            --table=public.director_workflow_versions \
            --table=public.director_canary_policy \
            --table=public.contentflow_retry_policies \
            --table=public.contentflow_capacity_phases \
            --table=public.contentflow_capacity_state \
            --table=public.contentflow_lane_models \
            --file "$DIR/runtime-control-data.sql"

          test -s "$DIR/schema.sql"
          test -s "$DIR/runtime-control-data.sql"
          grep -q "CREATE TABLE" "$DIR/schema.sql"
          grep -q "director_control_policy" "$DIR/runtime-control-data.sql"
          (cd "$DIR" && sha256sum schema.sql runtime-control-data.sql > SHA256SUMS)

          printf '{"project_ref":"koqpyfvnprmirqviafzq","created_at_utc":"%s","scope":"schema_plus_nonsecret_runtime_control","restore_order":["schema.sql","runtime-control-data.sql"],"integrity":"SHA256SUMS"}\n' "$(date -u +%FT%TZ)" > "$DIR/manifest.json"

      - name: Upload recovery artifact before git push
        uses: actions/upload-artifact@v4
        with:
          name: contentflow-recovery-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 30

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "contentflow-backup-bot"
          git config user.email "contentflow-backup-bot@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "backup: daily ContentFlow recovery snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
