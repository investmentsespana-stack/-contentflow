name: Trading Directional Portfolios LONG SHORT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trading-directional-portfolios.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-portfolios:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade databento pandas numpy pyarrow
      - name: Download frozen 38 ACTIVE_RESEARCH source set
        uses: actions/download-artifact@v4
        with:
          name: trading-active-robustness-crossmarket
          path: trading_super_strategy/portfolio_inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34780856253'
      - name: Download ES confirmatory checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-data-cache
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34776997342'
      - name: Download RTY confirmatory checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-regime-abc-data-RTY.v.0
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34779814764'
      - name: Download YM confirmatory checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-regime-abc-data-YM.v.0
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34779814764'
      - name: Download NQ confirmatory checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-regime-abc-data-NQ.v.0
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34779814764'
      - name: Compile portfolio builder
        run: python -m py_compile trading_super_strategy/directional_portfolio_build.py
      - name: Freeze LONG and SHORT portfolios before robustness
        working-directory: trading_super_strategy
        run: python directional_portfolio_build.py
      - name: Upload frozen directional portfolios
        uses: actions/upload-artifact@v4
        with:
          name: trading-directional-portfolios-frozen
          path: trading_super_strategy/directional_portfolio_output/
          if-no-files-found: error
          retention-days: 30

  robustness:
    needs: build-portfolios
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade databento pandas numpy
      - name: Download portfolios frozen before robustness
        uses: actions/download-artifact@v4
        with:
          name: trading-directional-portfolios-frozen
          path: trading_super_strategy/directional_portfolio_output
      - name: Compile portfolio robustness
        run: python -m py_compile trading_super_strategy/directional_portfolio_robustness.py
      - name: Run LONG SHORT portfolio robustness
        working-directory: trading_super_strategy
        run: python directional_portfolio_robustness.py
      - name: Upload portfolio robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: trading-directional-portfolios-robustness
          path: trading_super_strategy/directional_portfolio_robustness_output/
          if-no-files-found: error
          retention-days: 30
