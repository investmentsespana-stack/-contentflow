name: jarvis-desktop-ci

on:
  push:
    paths:
      - 'src/jarvis/**'
      - 'tests/jarvis-desktop.test.mjs'
      - 'scripts/jarvis-smoke.mjs'
      - 'JARVIS-WINDOWS.cmd'
      - '.github/workflows/jarvis-desktop-ci.yml'
  pull_request:
    paths:
      - 'src/jarvis/**'
      - 'tests/jarvis-desktop.test.mjs'
      - 'scripts/jarvis-smoke.mjs'
      - 'JARVIS-WINDOWS.cmd'
      - '.github/workflows/jarvis-desktop-ci.yml'

jobs:
  jarvis-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Jarvis contract tests
        run: npm run test:jarvis
      - name: Jarvis smoke test
        run: node scripts/jarvis-smoke.mjs
