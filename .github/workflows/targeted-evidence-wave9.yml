name: targeted-evidence-wave9
on:
  pull_request:
    paths:
      - '.github/workflows/targeted-evidence-wave9.yml'
      - 'src/guardrails/evidence-wave9-runtime.ts'
      - 'tests/evidence-wave9-runtime.spec.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/targeted-evidence-wave9.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - requirement_id: '39'
            builder_run_id: '1815'
            task_key: 'arch_guardrail_output_review_boundary'
            profile: 'runtime-test'
            property: 'output_completion_fail_closed'
          - requirement_id: '47'
            builder_run_id: '2079'
            task_key: 'arch_guardrail_output_review_boundary_quality_gate_integration_coherence_check_fix_implement_coheren'
            profile: 'runtime-test'
            property: 'lexical_nlp_coherence'
          - requirement_id: '34261'
            builder_run_id: '3668'
            task_key: 'arch_guardrail_deploy_completion_boundary_reversible_preconditions_rollback_plan_viability_fix_imple'
            profile: 'runtime-test'
            property: 'rollback_violation_durable_evidence'
          - requirement_id: '34262'
            builder_run_id: '3669'
            task_key: 'arch_guardrail_deploy_completion_boundary_reversible_preconditions_rollback_plan_viability_fix_integ'
            profile: 'runtime-test'
            property: 'rollback_integration_correlation'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run deterministic wave9 integration suite
        run: npx playwright test tests/evidence-wave9-runtime.spec.ts --project=chromium --workers=1
      - name: Produce sanitized payload
        env:
          PROPERTY: ${{ matrix.property }}
        run: node -e 'const fs=require("fs");fs.writeFileSync("/tmp/evidence-wave9.json",JSON.stringify({passed:true,suite:"evidence-wave9-runtime-integration",property:process.env.PROPERTY,test_file:"tests/evidence-wave9-runtime.spec.ts",source:"src/guardrails/evidence-wave9-runtime.ts"}))'
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-wave9-${{ matrix.requirement_id }}
          path: /tmp/evidence-wave9.json
          retention-days: 14
      - name: Install PostgreSQL 17 client
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Persist correlated PASS and reconcile
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REQUIREMENT_ID: ${{ matrix.requirement_id }}
          BUILDER_RUN_ID: ${{ matrix.builder_run_id }}
          TASK_KEY: ${{ matrix.task_key }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGHOST=aws-0-us-east-1.pooler.supabase.com PGPORT=5432 PGUSER=postgres.koqpyfvnprmirqviafzq PGDATABASE=postgres
          export BASE_PAYLOAD="$(cat /tmp/evidence-wave9.json)"
          export CI_PAYLOAD="$(node -e 'const b=JSON.parse(process.env.BASE_PAYLOAD);process.stdout.write(JSON.stringify({...b,repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,workflow_run_id:process.env.GITHUB_RUN_ID,produced_at:new Date().toISOString()}))')"
          psql -v ON_ERROR_STOP=1 -v requirement_id="$REQUIREMENT_ID" -v builder_run_id="$BUILDER_RUN_ID" -v task_key="$TASK_KEY" -v profile="$PROFILE" -v commit_sha="$GITHUB_SHA" -v workflow_run_id="$GITHUB_RUN_ID" -v payload="$CI_PAYLOAD" <<'SQL'
          select public.contentflow_record_ci_requirement_evidence(:'requirement_id'::bigint,:'builder_run_id'::bigint,:'task_key',:'profile',:'commit_sha',:'workflow_run_id',:'payload'::jsonb);
          select public.contentflow_reconcile_ci_requirement_evidence('contentflow');
          SQL
