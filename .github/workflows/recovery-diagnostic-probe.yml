name: Recovery Diagnostic Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-diagnostic-probe.yml'
      - '.github/workflows/daily-recovery-snapshot.yml'
      - '.github/scripts/resolve-recovery-db-password.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recovery-diagnostic-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          psql --version
          pg_dump --version
      - name: Probe direct and Session Pooler paths
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          mkdir -p backups/recovery-diagnostics
          SECRET_PRESENT=false
          DIRECT_READY=false
          DIRECT_DUMP_OK=false
          POOLER_READY=false
          POOLER_DUMP_OK=false
          DIRECT_ERROR_CLASS=not_attempted
          POOLER_ERROR_CLASS=not_attempted
          POOLER_DUMP_ERROR_CLASS=not_attempted
          CREDENTIAL_SOURCE=none

          classify_pg_error() {
            local f="$1"
            if grep -Eqi 'server version.*pg_dump version|aborting because of server version mismatch' "$f"; then echo client_version_mismatch
            elif grep -Eqi 'tenant or user not found|user not found|tenant.*not found' "$f"; then echo tenant_or_user_not_found
            elif grep -Eqi 'password authentication failed|authentication failed|wrong password|SCRAM exchange' "$f"; then echo auth_failed
            elif grep -Eqi 'could not translate host name|name or service not known|temporary failure in name resolution' "$f"; then echo dns_failed
            elif grep -Eqi 'timeout expired|connection timed out|operation timed out' "$f"; then echo timeout
            elif grep -Eqi 'connection refused' "$f"; then echo connection_refused
            elif grep -Eqi 'no route to host|network is unreachable|cannot assign requested address' "$f"; then echo network_unreachable
            elif grep -Eqi 'ssl|certificate' "$f"; then echo ssl_error
            elif [ -s "$f" ]; then echo postgres_rejected
            else echo unknown
            fi
          }

          if [ -n "$SUPABASE_DB_PASSWORD" ] || [ -n "$SUPABASE_DB_URL" ]; then SECRET_PRESENT=true; fi

          if [ -n "$SUPABASE_DB_URL" ]; then
            psql "$SUPABASE_DB_URL" -Atqc 'select 1' >/dev/null 2>/tmp/direct.err
            if [ $? -eq 0 ]; then DIRECT_READY=true; DIRECT_ERROR_CLASS=none; else DIRECT_ERROR_CLASS=$(classify_pg_error /tmp/direct.err); fi
            pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges --file /tmp/recovery-direct.sql >/dev/null 2>/tmp/direct-dump.err
            [ $? -eq 0 ] && [ -s /tmp/recovery-direct.sql ] && DIRECT_DUMP_OK=true
          fi

          export PGSSLMODE=require
          DB_ARGS=(-h aws-0-us-east-1.pooler.supabase.com -p 5432 -U postgres.koqpyfvnprmirqviafzq -d postgres)

          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            CREDENTIAL_SOURCE=dedicated_secret
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            psql "${DB_ARGS[@]}" -Atqc 'select 1' >/dev/null 2>/tmp/pooler.err
            if [ $? -eq 0 ]; then
              POOLER_READY=true
              POOLER_ERROR_CLASS=none
              pg_dump "${DB_ARGS[@]}" --schema-only --no-owner --no-privileges --file /tmp/recovery-pooler.sql >/dev/null 2>/tmp/pooler-dump.err
              if [ $? -eq 0 ] && [ -s /tmp/recovery-pooler.sql ]; then
                POOLER_DUMP_OK=true
                POOLER_DUMP_ERROR_CLASS=none
              else
                POOLER_DUMP_ERROR_CLASS=$(classify_pg_error /tmp/pooler-dump.err)
              fi
            else
              POOLER_ERROR_CLASS=$(classify_pg_error /tmp/pooler.err)
            fi
          elif [ -n "$SUPABASE_DB_URL" ]; then
            python3 .github/scripts/resolve-recovery-db-password.py
            if [ $? -eq 0 ]; then
              CREDENTIAL_SOURCE=$(cat /tmp/contentflow-recovery-password-source)
              export PGPASSWORD="$(cat /tmp/contentflow-recovery-db-password)"
              psql "${DB_ARGS[@]}" -Atqc 'select 1' >/dev/null 2>/tmp/pooler.err
              if [ $? -eq 0 ]; then
                POOLER_READY=true
                POOLER_ERROR_CLASS=none
                pg_dump "${DB_ARGS[@]}" --schema-only --no-owner --no-privileges --file /tmp/recovery-pooler.sql >/dev/null 2>/tmp/pooler-dump.err
                if [ $? -eq 0 ] && [ -s /tmp/recovery-pooler.sql ]; then POOLER_DUMP_OK=true; POOLER_DUMP_ERROR_CLASS=none; else POOLER_DUMP_ERROR_CLASS=$(classify_pg_error /tmp/pooler-dump.err); fi
              else
                POOLER_ERROR_CLASS=$(classify_pg_error /tmp/pooler.err)
              fi
            else
              CREDENTIAL_SOURCE=$(cat /tmp/contentflow-recovery-password-source 2>/dev/null || echo legacy_unresolved)
              POOLER_ERROR_CLASS=credential_unresolved
            fi
          fi

          printf '{"checked_at_utc":"%s","secret_present":%s,"direct_ready":%s,"direct_pg_dump_ok":%s,"direct_error_class":"%s","pooler_ready":%s,"pooler_pg_dump_ok":%s,"pooler_error_class":"%s","pooler_pg_dump_error_class":"%s","credential_source":"%s"}\n' "$(date -u +%FT%TZ)" "$SECRET_PRESENT" "$DIRECT_READY" "$DIRECT_DUMP_OK" "$DIRECT_ERROR_CLASS" "$POOLER_READY" "$POOLER_DUMP_OK" "$POOLER_ERROR_CLASS" "$POOLER_DUMP_ERROR_CLASS" "$CREDENTIAL_SOURCE" > /tmp/recovery-diagnostic-latest.json
      - name: Persist diagnostic marker without stale-SHA conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "contentflow-backup-bot"
          git config user.email "contentflow-backup-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p backups/recovery-diagnostics
          cp /tmp/recovery-diagnostic-latest.json backups/recovery-diagnostics/latest.json
          git add backups/recovery-diagnostics/latest.json
          git commit -m "diag: probe recovery canonical credential" || exit 0
          git push origin HEAD:main
