name: Trading Bollinger EMA SAR V3 Ratification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v3_ratification_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v3_ratification_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v3_ratification_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v3-ratification.yml'

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['ES.v.0','NQ.v.0','YM.v.0','RTY.v.0']
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      BES_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade databento pandas numpy
      - name: Compile V3
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v3_ratification_backtest.py
      - name: Run discovery-only V3
        run: python trading_super_strategy/bollinger_ema_sar_v3_ratification_backtest.py
      - name: Upload market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v3-ratification-${{ matrix.symbol }}
          path: bollinger_ema_sar_v3_ratification_output/
          if-no-files-found: error
          retention-days: 30

  consolidate:
    needs: backtest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v3-ratification-*
          path: bollinger_ema_sar_v3_ratification_downloads
      - name: Consolidate cross-market results
        run: python trading_super_strategy/bollinger_ema_sar_v3_ratification_consolidate.py
      - name: Upload cross-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v3-ratification-crossmarket
          path: bollinger_ema_sar_v3_ratification_crossmarket/
          if-no-files-found: error
          retention-days: 30
