name: Vibe Trading VPS Research Certification

on:
  push:
    paths:
      - 'trading_super_strategy/vibe_trading/**'
      - '.github/workflows/vibe-trading-vps-research-cert.yml'
  pull_request:
    paths:
      - 'trading_super_strategy/vibe_trading/**'
      - '.github/workflows/vibe-trading-vps-research-cert.yml'
      - 'trading_super_strategy/vibe_trading/nq6_frozen_vibe_smoke.py'
      - 'trading_super_strategy/vibe_trading/Test-NQ6FrozenWithVibe.ps1'
      - 'trading_super_strategy/vibe_trading/nq6_frozen_inventory.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package-cert:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Vibe-Trading
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vibe-trading-ai==0.1.15"
      - name: Verify CLI surfaces
        shell: pwsh
        run: |
          vibe-trading --version
          vibe-trading serve --help
          vibe-trading-mcp --help
      - name: Compile and inspect native Vibe control plane
        shell: pwsh
        run: |
          python -m py_compile trading_super_strategy/vibe_trading/tradingview_futures_guard.py trading_super_strategy/vibe_trading/asset_research.py trading_super_strategy/vibe_trading/Vibe-Codex-DeviceAuth.py trading_super_strategy/vibe_trading/vibe_full_preflight.py
          python -c "import importlib.util,pathlib; p=pathlib.Path('trading_super_strategy/vibe_trading/Vibe-Codex-DeviceAuth.py'); spec=importlib.util.spec_from_file_location('vibe_device_auth',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); assert m.DEVICE_VERIFY_URL=='https://auth.openai.com/codex/device'; assert m.DEVICE_REDIRECT_URI=='https://auth.openai.com/deviceauth/callback'; print('VIBE_DEVICE_AUTH_IMPORT_PASS')"
          $env:VIBE_TRADING_HOME = "$PWD\.ci-vibe-state"
          New-Item -ItemType Directory -Force "$env:VIBE_TRADING_HOME\swarm\presets" | Out-Null
          New-Item -ItemType Directory -Force "$HOME\.vibe-trading\swarm\presets" | Out-Null
          Copy-Item trading_super_strategy\vibe_trading\cygnus_native_smoke.yaml "$env:VIBE_TRADING_HOME\swarm\presets\"
          Copy-Item trading_super_strategy\vibe_trading\cygnus_futures_strategy_lab.yaml "$env:VIBE_TRADING_HOME\swarm\presets\"
          Copy-Item trading_super_strategy\vibe_trading\cygnus_dxy_macro_lab.yaml "$env:VIBE_TRADING_HOME\swarm\presets\"
          Copy-Item trading_super_strategy\vibe_trading\cygnus_native_smoke.yaml "$HOME\.vibe-trading\swarm\presets\"
          Copy-Item trading_super_strategy\vibe_trading\cygnus_futures_strategy_lab.yaml "$HOME\.vibe-trading\swarm\presets\"
          Copy-Item trading_super_strategy\vibe_trading\cygnus_dxy_macro_lab.yaml "$HOME\.vibe-trading\swarm\presets\"
          python -c "from src.swarm.presets import inspect_preset; names=['cygnus_native_smoke','cygnus_futures_strategy_lab','cygnus_dxy_macro_lab']; reports=[inspect_preset(n) for n in names]; assert all(r.get('valid') for r in reports), reports; print('VIBE_NATIVE_PRESETS_PASS')"
          python -c "import importlib.util,pathlib; p=pathlib.Path('trading_super_strategy/vibe_trading/asset_research.py'); s=importlib.util.spec_from_file_location('ar',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert set(m.ASSETS)=={'CL','ES','NQ','GC','DXY'}; assert m.ASSETS['DXY']['preset']=='cygnus_dxy_macro_lab'; print('VIBE_NATIVE_RUNNER_STATIC_PASS')"
      - name: Static safety assertions
        shell: pwsh
        run: |
          $s = Get-Content trading_super_strategy/vibe_trading/Install-VibeNativeV7.ps1 -Raw
          if ($s -notmatch '127\.0\.0\.1') { throw 'loopback bind missing' }
          if ($s -notmatch 'VIBE_TRADING_ENABLE_SHELL_TOOLS.*0') { throw 'shell tools fail-closed missing' }
          if ($s -notmatch 'LANGCHAIN_PROVIDER.*openai-codex') { throw 'native provider config missing' }
          if ($s -notmatch 'LANGCHAIN_MODEL_NAME.*openai-codex/gpt-5\.6-terra') { throw 'native model config missing' }
          $runner = Get-Content trading_super_strategy/vibe_trading/asset_research.py -Raw
          if ($runner -notmatch 'os\.environ\["LANGCHAIN_PROVIDER"\]\s*=\s*"openai-codex"') { throw 'runner provider pin missing' }
          if ($runner -notmatch 'os\.environ\["LANGCHAIN_MODEL_NAME"\]\s*=\s*"openai-codex/gpt-5\.6-terra"') { throw 'runner model pin missing' }
          if ($s -match 'mt5-live-trade|alpaca-live-trade|ibkr-live-trade') { throw 'live broker profile must not be installed' }
          $auth = Get-Content trading_super_strategy/vibe_trading/Vibe-Codex-DeviceAuth.py -Raw
          if ($auth -notmatch '_build_codex_token_storage') { throw 'device auth must use Vibe-owned storage' }
          if ($auth -match '\\.codex[/\\\\]auth\\.json') { throw 'device auth must not copy Codex CLI token' }
          if ($auth -notmatch 'deviceauth/usercode' -or $auth -notmatch 'deviceauth/token' -or $auth -notmatch 'deviceauth/callback') { throw 'device auth endpoints missing' }
          $v73 = Get-Content trading_super_strategy/vibe_trading/Patch-VibeNativeV73.ps1 -Raw
          if ($v73 -notmatch '\$HOME.*\.vibe-trading\\swarm\\presets') { throw 'V7.3 must install presets into Vibe 0.1.15 user preset path' }
          if ($v73 -notmatch 'openai-codex/gpt-5\.6-terra') { throw 'V7.3 supported ChatGPT Codex model missing' }
          $presets = @(
            'trading_super_strategy/vibe_trading/cygnus_native_smoke.yaml',
            'trading_super_strategy/vibe_trading/cygnus_futures_strategy_lab.yaml',
            'trading_super_strategy/vibe_trading/cygnus_dxy_macro_lab.yaml'
          )
          foreach($p in $presets){
            $t = Get-Content $p -Raw
            if($t -match '\bbash\b|background_run|cancel_background'){ throw "shell-capable tool in $p" }
          }
          $futures = Get-Content trading_super_strategy/vibe_trading/cygnus_futures_strategy_lab.yaml -Raw
          if($futures -notmatch 'HARD BACKTEST CONTRACT'){ throw 'hard backtest contract missing' }
          if($futures -notmatch 'strategy_manifest\.json'){ throw 'SQX transfer manifest contract missing' }
          if($futures -notmatch 'SQX_READY'){ throw 'SQX readiness gate missing' }
          if($futures -notmatch 'ZERO_BACKTESTED_CANDIDATES'){ throw 'zero-backtest fail-closed marker missing' }
          if($futures -notmatch 'STRATEGY_DISCOVERY_FAILED'){ throw 'judge fail-closed marker missing' }
          Write-Host "SAFETY_ASSERTIONS_PASS"
      - name: NQ6 frozen MCP probe
        shell: pwsh
        env:
          VIBE_TRADING_ENABLE_SHELL_TOOLS: '0'
        run: |
          $exe = (Get-Command vibe-trading-mcp).Source
          $p = Start-Process -FilePath $exe -ArgumentList @('--transport','http','--host','127.0.0.1','--port','8900') -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              $t = Test-NetConnection 127.0.0.1 -Port 8900 -WarningAction SilentlyContinue
              if ($t.TcpTestSucceeded) { $ok = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw 'VIBE_MCP_PORT_8900_NOT_READY' }
            python trading_super_strategy/vibe_trading/nq6_frozen_vibe_smoke.py --probe-only --mcp-url http://127.0.0.1:8900/mcp
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Package VPS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Cygnus-Vibe-Trading-Research\data | Out-Null
          Copy-Item trading_super_strategy\vibe_trading\install_vibe_trading_research.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\verify_vibe_trading_research.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\README.md dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\nq6_frozen_vibe_smoke.py dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Test-NQ6FrozenWithVibe.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\nq6_frozen_inventory.json dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\asset_research.py dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\tradingview_futures_guard.py dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_single_asset_strategy_desk.yaml dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_asset_research_minimal.yaml dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_V61.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_V61.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_V62.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_V62.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\vibe_full_preflight.py dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_native_smoke.yaml dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_futures_strategy_lab.yaml dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\cygnus_dxy_macro_lab.yaml dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Start-VibeNative.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Stop-VibeNative.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Vibe-Guardian.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Authorize-VibeCodex.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\AUTHORIZE_VIBE_CODEX.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Install-VibeNativeV7.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\INSTALL_VIBE_NATIVE_V7.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Patch-VibeNativeV71.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_NATIVE_V71.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Vibe-Codex-DeviceAuth.py dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Patch-VibeNativeV72.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_NATIVE_V72.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\Patch-VibeNativeV73.ps1 dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\PATCH_VIBE_NATIVE_V73.cmd dist\Cygnus-Vibe-Trading-Research\
          Copy-Item trading_super_strategy\vibe_trading\data\nq6_frozen_manifest.json dist\Cygnus-Vibe-Trading-Research\data\
      - uses: actions/upload-artifact@v4
        with:
          name: Cygnus-Vibe-Trading-VPS-Research
          path: dist/Cygnus-Vibe-Trading-Research/
          retention-days: 30


  nq6-frozen-vibe-smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VIBE_TRADING_ENABLE_SHELL_TOOLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Vibe-Trading
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vibe-trading-ai==0.1.15"
      - name: Stage frozen NQ6 manifest in allowed read root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          Copy-Item trading_super_strategy\vibe_trading\data\nq6_frozen_manifest.json data\nq6_frozen_manifest.json -Force
      - name: Execute Vibe MCP against frozen NQ6 identities
        shell: pwsh
        run: |
          python trading_super_strategy\vibe_trading\test_nq6_frozen_mcp.py
      - name: Emit research-only admission evidence
        shell: pwsh
        run: |
          Write-Host "VIBE_NQ6_FROZEN_RESEARCH_ONLY=PASS"
          Write-Host "LIVE=false"
          Write-Host "SHELL_TOOLS=false"
          Write-Host "BROKER_EXECUTION=false"
