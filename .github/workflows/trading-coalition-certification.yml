name: Trading Coalition Certification

on:
  push:
    paths:
      - 'trading_super_strategy/coalition_backtester.py'
      - 'trading_super_strategy/robustness_engine.py'
      - 'trading_super_strategy/tests/test_coalition_backtester.py'
      - '.github/workflows/trading-coalition-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coalition-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile coalition modules
        run: python -m py_compile trading_super_strategy/coalition_backtester.py trading_super_strategy/robustness_engine.py trading_super_strategy/tests/test_coalition_backtester.py
      - name: Run deterministic coalition tests
        run: PYTHONPATH=. python -m unittest trading_super_strategy.tests.test_coalition_backtester -v
