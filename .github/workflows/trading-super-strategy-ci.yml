name: Trading Super Strategy CI

on:
  push:
    paths:
      - 'trading_super_strategy/**'
      - '.github/workflows/trading-super-strategy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run trading super strategy tests
        working-directory: trading_super_strategy
        run: python -m unittest discover -v -p 'test_*.py'
