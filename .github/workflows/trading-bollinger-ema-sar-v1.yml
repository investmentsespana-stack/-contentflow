name: Trading Bollinger EMA SAR V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v1_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v1_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v1_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v1.yml'

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: ['ES.v.0', 'NQ.v.0', 'YM.v.0', 'RTY.v.0']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install databento pandas numpy
      - name: Compile strategy
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_backtest.py
      - name: Run discovery-only 1m backtest
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          BES_SYMBOL: ${{ matrix.symbol }}
        run: python trading_super_strategy/bollinger_ema_sar_v1_backtest.py
      - name: Upload market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-${{ matrix.symbol }}
          path: bollinger_ema_sar_v1_output/
          if-no-files-found: error

  consolidate:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download all market artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v1-*
          path: bollinger_ema_sar_v1_downloads
      - name: Consolidate cross-market results
        run: python trading_super_strategy/bollinger_ema_sar_v1_consolidate.py
      - name: Upload cross-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-crossmarket
          path: bollinger_ema_sar_v1_crossmarket/
          if-no-files-found: error
