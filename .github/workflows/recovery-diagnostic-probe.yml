name: Recovery Diagnostic Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-diagnostic-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Probe recovery connection without exposing secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          mkdir -p backups/recovery-diagnostics
          SECRET_PRESENT=false
          PG_READY=false
          PG_DUMP_OK=false
          if [ -n "$SUPABASE_DB_URL" ]; then
            SECRET_PRESENT=true
            pg_isready -d "$SUPABASE_DB_URL" >/dev/null 2>&1
            [ $? -eq 0 ] && PG_READY=true
            pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner --no-privileges --file /tmp/recovery-probe.sql >/dev/null 2>&1
            [ $? -eq 0 ] && [ -s /tmp/recovery-probe.sql ] && PG_DUMP_OK=true
          fi
          printf '{"checked_at_utc":"%s","secret_present":%s,"postgres_ready":%s,"pg_dump_ok":%s}\n' "$(date -u +%FT%TZ)" "$SECRET_PRESENT" "$PG_READY" "$PG_DUMP_OK" > backups/recovery-diagnostics/latest.json
      - name: Persist diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "contentflow-backup-bot"
          git config user.email "contentflow-backup-bot@users.noreply.github.com"
          git add backups/recovery-diagnostics/latest.json
          git commit -m "diag: record recovery database preflight" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
