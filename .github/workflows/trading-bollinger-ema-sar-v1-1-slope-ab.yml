name: Trading Bollinger EMA SAR V1.1 Slope AB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_backtest.py'
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v1-1-slope-ab.yml'

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['ES.v.0','NQ.v.0','YM.v.0','RTY.v.0']
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      BES_SYMBOL: ${{ matrix.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade databento pandas numpy
      - name: Compile v1.1 slope A/B
        run: python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_backtest.py
      - name: Run discovery-only slope comparison
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v1_1_slope_ab_backtest.py
      - name: Upload market slope evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-1-slope-${{ matrix.symbol }}
          path: trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_output/
          if-no-files-found: error
          retention-days: 30

  consolidate:
    needs: backtest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download all market slope artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v1-1-slope-*
          path: trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_downloads
      - name: Consolidate slope comparison
        working-directory: trading_super_strategy
        run: python bollinger_ema_sar_v1_1_slope_ab_consolidate.py
      - name: Upload cross-market slope evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-1-slope-crossmarket
          path: trading_super_strategy/bollinger_ema_sar_v1_1_slope_ab_crossmarket/
          if-no-files-found: error
          retention-days: 30
