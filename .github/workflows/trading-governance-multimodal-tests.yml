name: Trading Governance Multimodal Tests

on:
  pull_request:
    paths:
      - 'trading_super_strategy/governance/**'
      - 'trading_super_strategy/multimodal/**'
      - 'trading_super_strategy/agent_orchestrator.py'
      - 'trading_super_strategy/agent_pool_config.json'
      - 'tests/test_trading_governance_multimodal.py'
      - '.github/workflows/trading-governance-multimodal-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run governance and multimodal tests
        run: python -m pytest -q tests/test_trading_governance_multimodal.py
