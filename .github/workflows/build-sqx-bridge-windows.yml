name: Build SQX Bridge Windows

on:
  workflow_dispatch:
  push:
    branches: [main, fix/sqx-build142-cli-bridge]
    paths:
      - 'trading_super_strategy/sqx_bridge/**'
      - '.github/workflows/build-sqx-bridge-windows.yml'
  pull_request:
    paths:
      - 'trading_super_strategy/sqx_bridge/**'
      - '.github/workflows/build-sqx-bridge-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r trading_super_strategy/sqx_bridge/requirements.txt pyinstaller
      - name: Compile source
        shell: pwsh
        run: python -m py_compile trading_super_strategy/sqx_bridge/app.py

      - name: Test startup certification gate
        shell: pwsh
        run: python trading_super_strategy/sqx_bridge/test_startup_gate.py
      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name CygnusSQXBridge `
            --collect-all keyring `
            trading_super_strategy/sqx_bridge/app.py
      - name: Create distribution README
        shell: pwsh
        run: |
          @"
          CYGNUS SQX BRIDGE - STRATEGYQUANT BUILD 142

          1. Close the normal StrategyQuant X graphical application.
          2. Double-click CygnusSQXBridge.exe.
          3. Confirm the sqcli.exe path, expected C:\OI\sqcli.exe.
          4. Enter the one-time pairing code supplied by the Director.
          5. Keep project start/stop OFF for the first certification.
          6. Use Probar SQX; PASS must return real StrategyQuant projects.

          Transport: direct sqcli.exe process calls. No MCP. No live-money execution.
          "@ | Out-File -Encoding utf8 dist/LEEME.txt
      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: Cygnus-SQX-Bridge-Windows-Build142
          path: |
            dist/CygnusSQXBridge.exe
            dist/LEEME.txt
          if-no-files-found: error
          retention-days: 30
