name: Trading Research Agent Mission

on:
  push:
    paths:
      - 'trading_super_strategy/agent_orchestrator.py'
      - 'trading_super_strategy/agent_pool_config.json'
      - 'trading_super_strategy/run_agent_mission.py'
      - '.github/workflows/trading-agent-mission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assign-research-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate research agent pool
        run: python -m unittest trading_super_strategy/test_agent_orchestrator.py -v
      - name: Assign parallel research mission
        run: python trading_super_strategy/run_agent_mission.py
      - name: Upload mission assignment artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-agent-mission-assignments
          path: trading_super_strategy/agent_mission_output/
          retention-days: 30
