name: Trading Bollinger EMA SAR V1.1 Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_robustness_spec.json'
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_robustness.py'
      - 'trading_super_strategy/bollinger_ema_sar_v1_1_consolidate.py'
      - '.github/workflows/trading-bollinger-ema-sar-v1-1.yml'

permissions:
  contents: read
  actions: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: ['ES.v.0', 'NQ.v.0', 'YM.v.0', 'RTY.v.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install databento pandas numpy
      - name: Compile robustness study
        run: |
          python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_backtest.py
          python -m py_compile trading_super_strategy/bollinger_ema_sar_v1_1_robustness.py
      - name: Run discovery-only robustness cube
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          BES_SYMBOL: ${{ matrix.symbol }}
        run: python trading_super_strategy/bollinger_ema_sar_v1_1_robustness.py
      - name: Upload market robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-1-robustness-${{ matrix.symbol }}
          path: bollinger_ema_sar_v1_1_robustness_output/
          if-no-files-found: error
          retention-days: 90

  consolidate:
    needs: robustness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install consolidation dependencies
        run: python -m pip install pandas numpy
      - name: Download all market robustness artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bes-v1-1-robustness-*
          path: bollinger_ema_sar_v1_1_downloads
      - name: Consolidate and apply preregistered hard gates
        run: python trading_super_strategy/bollinger_ema_sar_v1_1_consolidate.py
      - name: Upload cross-market robustness evidence
        uses: actions/upload-artifact@v4
        with:
          name: bes-v1-1-robustness-crossmarket
          path: bollinger_ema_sar_v1_1_crossmarket/
          if-no-files-found: error
          retention-days: 90
