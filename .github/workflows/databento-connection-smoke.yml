name: Databento Connection Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  databento-auth-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Databento client
        run: python -m pip install --upgrade databento

      - name: Verify Databento secret and authentication
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import databento as db

          key = os.getenv("DATABENTO_API_KEY", "")
          if not key:
              raise SystemExit("DATABENTO_API_KEY secret is missing")

          client = db.Historical(key)
          dataset_range = client.metadata.get_dataset_range(dataset="GLBX.MDP3")
          print("DATABENTO_AUTH_OK")
          print("GLBX.MDP3 dataset range:", dataset_range)
          PY
