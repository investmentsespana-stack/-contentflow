name: Trading Phase 3 Risk Gate V2 ES Sharded

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trading_super_strategy/phase3_risk_gate_v2_rr_shard.py'
      - 'trading_super_strategy/phase3_risk_gate_v2_consolidate.py'
      - '.github/workflows/trading-phase3-risk-gate-v2-es-sharded.yml'

permissions:
  contents: read
  actions: read

jobs:
  rr-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rr: ['0.5','0.7','0.75','1.0','1.5','2.0','3.0','4.0']
    env:
      PHASE3_SYMBOL: 'ES.v.0'
      PHASE3_RR_FILTER: ${{ matrix.rr }}
      PHASE3_V2_INPUT_PARQUET: phase3_risk_gate_v2_data_cache/ES.v.0.parquet
      PHASE3_COST_R: '0.03'
      PHASE3_MIN_TRADES: '60'
      PHASE3_MIN_FOLD_TRADES: '5'
      PHASE3_MIN_FOLDS: '3'
      PHASE3_MIN_POSITIVE_FOLD_RATE: '0.60'
      PHASE3_V2_MC_ITERATIONS: '2000'
      PHASE3_V2_BLOCK_LENGTHS: '5,20'
      PHASE3_V2_CAPITAL_DD_BUDGET: '0.10'
      PHASE3_V2_PRIMARY_PROFILE: conservative_025pct
      PHASE3_V2_MAX_RUIN_PROB: '0.01'
      PHASE3_V2_DSR_THRESHOLD: '0.95'
      PHASE3_V2_SURVIVOR_POOL_TRIALS: '165'
      PHASE3_V2_FULL_SEARCH_TRIALS: '833140'
      PHASE3_V2_PBO_MAX: '0.50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade databento pandas pyarrow
      - name: Download Phase 2 60-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/60/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759467675'
      - name: Download Phase 2 126-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/126/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759985485'
      - name: Download Phase 2 250-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/250/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34761821904'
      - name: Download immutable ES market checkpoint
        uses: actions/download-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-data-cache
          path: trading_super_strategy/phase3_risk_gate_v2_data_cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34776997342'
      - name: Compile shard calculator
        run: python -m py_compile trading_super_strategy/phase3_risk_gate_v2_rr_shard.py
      - name: Run RR shard
        working-directory: trading_super_strategy
        run: python phase3_risk_gate_v2_rr_shard.py
      - name: Upload RR shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: trading-phase3-v2-es-shard-${{ matrix.rr }}
          path: trading_super_strategy/phase3_risk_gate_v2_shards/
          if-no-files-found: error
          retention-days: 30

  consolidate:
    needs: rr-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHASE3_SYMBOL: 'ES.v.0'
      PHASE3_V2_MC_ITERATIONS: '2000'
      PHASE3_V2_BLOCK_LENGTHS: '5,20'
      PHASE3_V2_CAPITAL_DD_BUDGET: '0.10'
      PHASE3_V2_PRIMARY_PROFILE: conservative_025pct
      PHASE3_V2_MAX_RUIN_PROB: '0.01'
      PHASE3_V2_DSR_THRESHOLD: '0.95'
      PHASE3_V2_SURVIVOR_POOL_TRIALS: '165'
      PHASE3_V2_FULL_SEARCH_TRIALS: '833140'
      PHASE3_V2_PBO_MAX: '0.50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade databento pandas
      - name: Download Phase 2 60-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/60/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759467675'
      - name: Download Phase 2 126-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/126/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34759985485'
      - name: Download Phase 2 250-session survivors
        uses: actions/download-artifact@v4
        with:
          name: trading-phase2-ES.v.0
          path: trading_super_strategy/phase3_inputs/250/trading-phase2-ES.v.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34761821904'
      - name: Download all RR shards
        uses: actions/download-artifact@v4
        with:
          pattern: trading-phase3-v2-es-shard-*
          path: trading_super_strategy/phase3_risk_gate_v2_shards
          merge-multiple: true
      - name: Consolidate complete ES pool
        working-directory: trading_super_strategy
        run: python phase3_risk_gate_v2_consolidate.py
      - name: Upload final ES V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: trading-phase3-risk-v2-ES.v.0-sharded
          path: trading_super_strategy/phase3_risk_gate_v2_output/
          if-no-files-found: error
          retention-days: 30
