name: Daily ContentFlow Recovery Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-recovery-snapshot.yml'
      - '.github/scripts/resolve-recovery-db-password.py'
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-contentflow-recovery-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovery credential source
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo 'SUPABASE_DB_PASSWORD (preferred) or legacy SUPABASE_DB_URL is required.'
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve and verify Session Pooler credential
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-recovery-db-password.py
          echo 'Session Pooler authentication verified without URI password reconstruction.'

      - name: Create dated recovery snapshot
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$(cat /tmp/contentflow-recovery-db-password)"
          export PGSSLMODE=require
          DB_ARGS=(-h aws-0-us-east-1.pooler.supabase.com -p 5432 -U postgres.koqpyfvnprmirqviafzq -d postgres)
          DAY=$(date -u +%Y-%m-%d)
          DIR="backups/${DAY}"
          mkdir -p "$DIR"

          pg_dump "${DB_ARGS[@]}" --schema-only --no-owner --no-privileges --file "$DIR/schema.sql"
          pg_dump "${DB_ARGS[@]}" --data-only --column-inserts --no-owner --no-privileges \
            --table=public.director_control_policy \
            --table=public.director_operating_rules \
            --table=public.director_repair_recipes \
            --table=public.director_workflow_versions \
            --table=public.director_canary_policy \
            --table=public.contentflow_retry_policies \
            --table=public.contentflow_capacity_phases \
            --table=public.contentflow_capacity_state \
            --table=public.contentflow_lane_models \
            --file "$DIR/runtime-control-data.sql"

          test -s "$DIR/schema.sql"
          test -s "$DIR/runtime-control-data.sql"
          grep -q "CREATE TABLE" "$DIR/schema.sql"
          grep -q "director_control_policy" "$DIR/runtime-control-data.sql"
          (cd "$DIR" && sha256sum schema.sql runtime-control-data.sql > SHA256SUMS)
          printf '{"project_ref":"koqpyfvnprmirqviafzq","created_at_utc":"%s","scope":"schema_plus_nonsecret_runtime_control","connection_mode":"supavisor_session_pgpassword","restore_order":["schema.sql","runtime-control-data.sql"],"integrity":"SHA256SUMS"}\n' "$(date -u +%FT%TZ)" > "$DIR/manifest.json"

      - name: Upload recovery artifact before git push
        uses: actions/upload-artifact@v4
        with:
          name: contentflow-recovery-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 30

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "contentflow-backup-bot"
          git config user.email "contentflow-backup-bot@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "backup: daily ContentFlow recovery snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
